<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token() }}" />
  <title>Cadastro - FoodMatch</title>
  <link rel="stylesheet" href="Cadastro.css" />
</head>
<body>
  <img src="moon-solid.svg" class="lua" />

  <div class="cadastro-container">
    <form class="cadastro-box" id="cadastroForm">
      <h2>Cadastro</h2>
      
      <div id="message" style="display: none; padding: 10px; margin: 10px 0; border-radius: 5px;"></div>

      <label for="email"><h4> Endereço de Email</h4></label>
      <input type="email" id="email" required />

      <label for="usuario"><h4>Nome de Usuário</h4></label>
      <input type="text" id="usuario" required />

      <label for="senha"><h4>Digite uma senha</h4></label>
      <input type="password" id="senha" required />

      <label for="confirmarSenha"><h4>Confirme a senha</h4></label>
      <input type="password" id="confirmarSenha" required />

      <button type="submit">Cadastrar</button>

      <div class="ajuda">Precisa de ajuda?</div>

      <div class="login">
        Já tem uma conta? <a href="Login.html">Faça o login</a>
      </div>
    </form>
  </div>

  <script>
    let isPasswordReset = false;
    
    // Verificar se é redefinição de senha
    document.addEventListener('DOMContentLoaded', function() {
      fetch('/perfil-dados')
        .then(response => response.json())
        .then(data => {
          // Se há sessão de reset, é redefinição de senha
          if (data.reset_mode) {
            isPasswordReset = true;
            document.querySelector('h2').textContent = 'Redefinir Senha';
            document.querySelector('button[type="submit"]').textContent = 'Atualizar Senha';
            
            // Ocultar campos desnecessários
            document.querySelector('label[for="usuario"]').style.display = 'none';
            document.getElementById('usuario').style.display = 'none';
            document.querySelector('label[for="email"]').style.display = 'none';
            document.getElementById('email').style.display = 'none';
            
            // Focar na senha
            document.getElementById('senha').focus();
          }
        })
        .catch(() => {
          // Continuar com cadastro normal
        });
    });
    
    document.getElementById('cadastroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const messageDiv = document.getElementById('message');
      
      if (senha !== confirmarSenha) {
        messageDiv.style.display = 'block';
        messageDiv.style.backgroundColor = '#f8d7da';
        messageDiv.style.color = '#721c24';
        messageDiv.textContent = 'As senhas não coincidem!';
        return;
      }
      
      if (isPasswordReset) {
        // Atualizar apenas a senha
        fetch('/atualizar-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha_usuario: senha })
        })
        .then(response => response.json())
        .then(data => {
          messageDiv.style.display = 'block';
          if (data.success) {
            messageDiv.style.backgroundColor = '#d4edda';
            messageDiv.style.color = '#155724';
            messageDiv.textContent = data.message;
            setTimeout(() => window.location.href = data.redirect || 'Doof.html', 2000);
          } else {
            messageDiv.style.backgroundColor = '#f8d7da';
            messageDiv.style.color = '#721c24';
            messageDiv.textContent = data.message;
          }
        })
        .catch(error => {
          messageDiv.style.display = 'block';
          messageDiv.style.backgroundColor = '#f8d7da';
          messageDiv.style.color = '#721c24';
          messageDiv.textContent = 'Erro ao atualizar senha.';
        });
      } else {
        // Cadastro normal
        const nome = document.getElementById('usuario').value;
        const email = document.getElementById('email').value;
        
        fetch('/cadastro-teste?nome=' + encodeURIComponent(nome) + '&email=' + encodeURIComponent(email) + '&senha=' + encodeURIComponent(senha), {
          method: 'GET'
        })
        .then(response => response.json())
        .then(data => {
          messageDiv.style.display = 'block';
          if (data.success) {
            messageDiv.style.backgroundColor = '#d4edda';
            messageDiv.style.color = '#155724';
            messageDiv.textContent = data.message;
            setTimeout(() => window.location.href = 'Doof.html', 2000);
          } else {
            messageDiv.style.backgroundColor = '#f8d7da';
            messageDiv.style.color = '#721c24';
            messageDiv.textContent = data.message;
          }
        })
        .catch(error => {
          messageDiv.style.display = 'block';
          messageDiv.style.backgroundColor = '#f8d7da';
          messageDiv.style.color = '#721c24';
          messageDiv.textContent = 'Erro ao processar cadastro.';
        });
      }
    });
  </script>
</body>
</html>
