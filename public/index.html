<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodMatch</title>
    <link rel="stylesheet" href="style.css" />

</head>

<body>
    <header>
        <img src="" div class="icone-menu"></div>
        <div class="topo-direita">
            <img src="moon-solid.svg" class="lua">
       
            <div class="language-selector">
                <img src="https://flagcdn.com/w40/br.png" alt="BR" id="mainFlag">
                <div class="language-options" id="languageOptions">
                    <img src="https://flagcdn.com/w40/us.png" alt="EN" class="option-flag">
                </div>
            </div>
            <button class="botao-login">
                <img src="user.png" class="icone-login" onclick="toggleSidebar()">
                <a href="Login.html" id="loginLink">Login</a>
            </button>
            <div class="profile-sidebar" id="profileSidebar" style="display: none;">
                <div class="user">
                    <img src="user.png" alt="Ícone perfil" id="userPhoto">
                    <h3 id="userName">Admin</h3>
                </div>
                <a href="PerfilEmpresarial.html"><button>💼 Perfil Empresarial</button></a>
                <a href="Publicidade.html"><button>📢 Gerenciar Publicidade</button></a>
                <a href="suporte.html"><button>🎧 Suporte</button></a>
            </div>
        </div>
    </header>

    <main>
        <img src="Food_Match-removebg-preview.png" alt="" class="fundo-prato-modelo" style="display:none;">

        <h1 class="titulo">
            <span class="palavra">FOOD</span><br>
            <span class="palavra">MATCH</span>
        </h1>
        <p class="subtitulo">— Soluções inteligentes para receitas personalizadas —</p>
        <div class="busca">
            <button><a href="Doof.html"><img src="magnifying-glass-solid.svg" class="icone-busca"></a> </button>
            <input type="text" placeholder="O que você quer cozinhar hoje?" />
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
