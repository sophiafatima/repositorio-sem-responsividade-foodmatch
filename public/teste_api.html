<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Receitas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Teste API de Receitas</h1>
        
        <div class="form-group">
            <label for="ingredientes">O que você quer cozinhar?</label>
            <input type="text" id="ingredientes" placeholder="Digite qualquer receita do mundo" value="pad thai">
        </div>
        
        <button onclick="testarGerarReceita()">Gerar Receita</button>
        <button onclick="listarReceitas()">Listar Receitas</button>
        
        <div id="resultado" class="result" style="display: none;"></div>
    </div>

    <script>
        function testarGerarReceita() {
            const ingredientes = document.getElementById('ingredientes').value;
            const resultado = document.getElementById('resultado');
            
            if (!ingredientes.trim()) {
                mostrarResultado('Por favor, digite alguns ingredientes!', 'error');
                return;
            }
            
            mostrarResultado('Gerando receita...', 'success');
            
            fetch('/receita/gerar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ingredientes: ingredientes,
                    preferencias: {}
                })
            })
            .then(response => {
                console.log('Status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Resposta:', data);
                if (data.success) {
                    mostrarResultado(`
                        <h3>Receita Gerada com Sucesso!</h3>
                        <p><strong>Nome:</strong> ${data.receita.nome}</p>
                        <p><strong>Ingredientes:</strong> ${data.receita.ingredientes.join(', ')}</p>
                        <p><strong>Modo de Preparo:</strong></p>
                        <pre>${data.receita.modo_preparo}</pre>
                        <p><strong>ID no banco:</strong> ${data.id}</p>
                    `, 'success');
                } else {
                    mostrarResultado(`Erro: ${data.message}`, 'error');
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                mostrarResultado(`Erro na requisição: ${error.message}`, 'error');
            });
        }
        
        function listarReceitas() {
            mostrarResultado('Carregando receitas...', 'success');
            
            fetch('/receitas')
            .then(response => response.text())
            .then(html => {
                mostrarResultado('Receitas carregadas! Verifique a página /receitas', 'success');
                window.open('/receitas', '_blank');
            })
            .catch(error => {
                console.error('Erro:', error);
                mostrarResultado(`Erro ao carregar receitas: ${error.message}`, 'error');
            });
        }
        
        function mostrarResultado(mensagem, tipo) {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = mensagem;
            resultado.className = `result ${tipo}`;
            resultado.style.display = 'block';
        }
    </script>
</body>
</html>
